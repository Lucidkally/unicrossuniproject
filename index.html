<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UNICROSS</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#1f2430;--mut:#6b7280;--line:#d9dde3;--acc:#1b6fb3;--ai:#fff;--ok:#1a7a3c;--okb:#e3f6ea;--wn:#9a6400;--wnb:#fdf1d6;--bd:#b3261e;--bdb:#fbe4e2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131c;--card:#181c28;--ink:#e7e9f0;--mut:#99a0b2;--line:#2b3040;--acc:#5fa8e0;--ai:#0c1018;--ok:#6fd49a;--okb:#123a25;--wn:#f0b752;--wnb:#3d2d0c;--bd:#ff8f86;--bdb:#4a1a17}}
:root[data-theme="dark"]{--bg:#10131c;--card:#181c28;--ink:#e7e9f0;--mut:#99a0b2;--line:#2b3040;--acc:#5fa8e0;--ai:#0c1018;--ok:#6fd49a;--okb:#123a25;--wn:#f0b752;--wnb:#3d2d0c;--bd:#ff8f86;--bdb:#4a1a17}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{margin:0 0 6px;font-weight:700}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--card)}
.brand{font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px}
.brand img{width:30px;height:30px}
nav{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
main{max-width:780px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:14px}
.mut{color:var(--mut)}.sc{overflow-x:auto}
label{display:block;font-weight:600;margin:10px 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.02em;color:var(--mut)}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
button{font:inherit;padding:9px 14px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.p{background:var(--acc);color:var(--ai);border-color:var(--acc);font-weight:700;width:100%;padding:13px;font-size:15px;margin-top:14px}
button.on{border-color:var(--acc);color:var(--acc);font-weight:600}
button.s{padding:5px 10px;font-size:13px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.b{padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600}
.Pending,.Returned,.NotFound,.Amended{background:var(--wnb);color:var(--wn)}
.Compiled,.Approved,.Authentic{background:var(--okb);color:var(--ok)}
.Altered{background:var(--bdb);color:var(--bd)}
code,.h{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;word-break:break-all}
.verdict{border-radius:8px;padding:14px;margin-bottom:12px;font-weight:700;font-size:19px}
.verdict.Authentic{background:var(--okb);color:var(--ok)}.verdict.Altered{background:var(--bdb);color:var(--bd)}.verdict.NotFound{background:var(--wnb);color:var(--wn)}
.hs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.hs div{border:1px solid var(--line);border-radius:6px;padding:10px}
.blocks{display:flex;overflow-x:auto;padding-bottom:6px}
.blk{flex:0 0 150px;border:2px solid var(--acc);border-radius:8px;padding:8px;margin-right:18px;position:relative;background:var(--card)}
.blk:not(:last-child):after{content:"";position:absolute;right:-20px;top:50%;width:18px;border-top:3px solid var(--acc)}
.blk.bad{border-color:var(--bd)}
.msg{padding:9px 12px;border-radius:6px;background:var(--wnb);color:var(--wn);margin-bottom:12px}
.auth{max-width:380px;margin:40px auto}
.auth h2{text-align:center;font-size:20px;margin-bottom:4px}
.auth .sub{text-align:center;color:var(--mut);margin-bottom:18px;font-size:13px}
.auth input{margin-bottom:12px}
.ipw{position:relative}.ipw input{padding-right:38px}
.ipw .eye{position:absolute;right:10px;top:12px;cursor:pointer;color:var(--mut);font-size:16px;user-select:none}
.ctr{text-align:center}
.bars{display:flex;flex-direction:column;gap:3px;margin-top:4px}
.bar{display:flex;align-items:center;gap:10px;padding:14px 14px;border-radius:5px;color:#fff;font-weight:700;border:0;width:100%;text-align:left;font-size:14px}
.bar .ic{font-size:18px}
.bar.c1{background:#2e9e4f}.bar.c2{background:#1b84bf}.bar.c3{background:#bf5a1b}.bar.c4{background:#49617a}.bar.c5{background:#6b4fa0}
.slip-head{text-align:center;margin-bottom:10px}
.slip-head img{width:60px;height:60px}
.slip-head .u{font-weight:700;font-size:17px;margin-top:4px}
.slip-head .addr{color:var(--mut);font-size:12.5px}
.bio{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;margin:12px 0;font-size:14px}
.bio b{font-weight:600}
.gpa-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px;font-size:14px}
.gpa-row div{border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.gpa-row b{display:block;font-size:17px}
.gd{display:inline-block;width:22px;text-align:center;border-radius:4px;color:#fff;font-weight:700;font-size:12px}
@media print{header,.noprint,button{display:none!important}body,.card{background:#fff!important;color:#000!important}.card{border:0;padding:0}}
</style></head><body>
<header><div class="brand" id="bh"></div><nav id="nav"></nav></header>
<main id="app"></main>

HOD:[['pend','Pending Approval','PND'],['appr','Approved Results','APR'],['aud','Audit Trail','AUD']],
RecordsUnit:[['chg','Change Approvals','CHG'],['comp','Compiled Results','CMP'],['cert','Certificates','CRT'],['aud','Audit Trail','AUD']],
Admin:[['chain','Blockchain Ledger','CHN'],['aud','Audit Trail','AUD'],['vlog','Verification Log','VLG']]};
function homeV(){if(me.role=='Student')return`<div class="card"><h2>Welcome, ${esc(me.name)}</h2><p class="mut">${stu(me.sid).matric}</p></div><div class="bars">${T.Student.map(x=>`<button class="bar ${x[3]}" onclick="tab='${x[0]}';render()"><span class="ic">${x[2]}</span>${x[1]}</button>`).join('')}<button class="bar c4" style="background:#44536b" onclick="me=null;go('home')"><span class="ic">OUT</span>Home / Log out</button></div>`;
 return`<div class="card"><h2>Welcome, ${esc(me.name)}</h2><p class="mut">${me.role}</p><div class="row" style="margin-top:10px">${T[me.role].map(x=>`<button onclick="tab='${x[0]}';render()" style="text-align:left;padding:14px"><b>${x[2]} - ${x[1]}</b></button>`).join('')}</div></div>`}
function dashV(){if(!me)return loginV('Student');return tab?(me.role=='Student'?studentSec():staffSec()):homeV()}
const sq=()=>`<input class="q noprint" placeholder="Search by course or reg. number" oninput="filt(this.value)" aria-label="Search" style="margin-bottom:10px">`;
function filt(v){v=v.toLowerCase();document.querySelectorAll('.sec tr').forEach(tr=>{if(!tr.querySelector('th'))tr.style.display=tr.textContent.toLowerCase().includes(v)?'':'none'})}
const sec=(t,b,ns)=>`<button class="noprint" onclick="tab='';render()">Back to dashboard</button><h2 style="margin-top:12px">${t}</h2>${ns?'':sq()}<div class="sec">${b}</div>`;
const resTable=(rows,act)=>`<div class="sc"><table><tr><th>ID</th><th>Reg. No.</th><th>Student</th><th>Course</th><th>Score</th><th>Grade</th><th>Status</th><th>Block</th>${act?'<th></th>':''}</tr>${rows.map(r=>`<tr><td>RES-${r.id}</td><td>${stu(r.studentId).matric}</td><td>${esc(stu(r.studentId).name)}</td><td>${crs(r.courseId).code}</td><td>${r.score}</td><td>${r.grade}</td><td><span class="b ${r.status}">${r.status}</span></td><td>${r.blockId||'-'}</td>${act?`<td>${act(r)}</td>`:''}</tr>`).join('')||`<tr><td colspan="9" class="mut">Nothing here yet.</td></tr>`}</table></div>`;
const auditV=()=>`<div class="sc"><table><tr><th>When</th><th>Result</th><th>Action</th><th>By</th><th>Change</th><th>Reason</th></tr>${DB.audit.map(a=>`<tr><td>${a.at}</td><td>RES-${a.resId}, ${a.reg}</td><td>${a.action}</td><td>${esc(a.by)} (${a.role})</td><td>${a.o.score} (${a.o.grade}) to ${a.n.score} (${a.n.grade})</td><td style="white-space:normal">${esc(a.reason||'')}</td></tr>`).join('')||'<tr><td colspan="6" class="mut">No changes recorded yet.</td></tr>'}</table></div>`;
const audit=(action,r,o,n,reason)=>DB.audit.unshift({at:now(),resId:r.id,reg:stu(r.studentId).matric,action,by:me.name,role:me.role,o,n,reason});
const chainV=()=>`<div class="blocks">${DB.blocks.map(b=>`<div class="blk ${chainMsg&&chainMsg.bad.includes(b.id)?'bad':''}"><b>Block ${b.id}</b><div class="mut" style="font-size:12px">${b.ts}</div><div class="h">prev ${short(b.prev)}</div><div class="h">hash ${short(b.hash)}</div></div>`).join('')}</div>${chainMsg?`<div class="msg" style="margin-top:10px;${chainMsg.bad.length?'background:var(--bdb);color:var(--bd)':'background:var(--okb);color:var(--ok)'}">${chainMsg.t}</div>`:''}<button onclick="checkChain()">Check chain integrity</button> <button onclick="tamper()">Run tamper test</button><p class="mut">The tamper test changes a score directly in the database, with no reason, approval or audit entry. Verifying that result then shows Altered.</p>`;
const vlogV=()=>`<div class="sc"><table><tr><th>#</th><th>Reg. No.</th><th>Record</th><th>Verifier</th><th>Checked</th><th>Result</th></tr>${DB.log.map(l=>`<tr><td>${l.id}</td><td>${esc(l.reg||'-')}</td><td>${esc(l.rec)}</td><td>${esc(l.who)}</td><td>${l.at}</td><td><span class="b ${l.res}">${l.res}</span></td></tr>`).join('')||'<tr><td colspan="6" class="mut">No verification attempts yet.</td></tr>'}</table></div>`;
const isPaid=(id,sess)=>DB.payments.some(p=>p.studentId==id&&p.session==sess);
const isReg=(sid,cid,sess)=>DB.regs.some(r=>r.studentId==sid&&r.courseId==cid&&r.session==sess);
const regCourses=(sid,sess)=>DB.courses.filter(c=>isReg(sid,c.id,sess));
const hasRes=(sid,cid,sess)=>DB.results.some(r=>r.studentId==sid&&r.courseId==cid&&r.session==sess&&r.status!='Returned');
function fillCourses(){const el=$('#rc');if(!el)return;const sid=+$('#rs').value,sess=$('#rse').value;el.innerHTML=regCourses(sid,sess).filter(c=>!hasRes(sid,c.id,sess)).map(c=>`<option value="${c.id}">${c.code} ${c.title}</option>`).join('')||'<option value="">No registered courses to grade</option>'}
function staffSec(){const R=DB.results,st=x=>R.filter(q=>q.status==x),r=me.role,f=T[r].find(x=>x[0]==tab);if(!f)return homeV();let b='',ns=0;
 if(tab=='aud')b=auditV();
 else if(r=='Lecturer')b=tab=='enter'?(ns=1,`<p class="mut">Only courses the student has registered can be graded.</p><div class="card"><div class="row"><div><label>Student</label><select id="rs" onchange="fillCourses()">${DB.students.map(s=>`<option value="${s.id}">${s.matric} ${esc(s.name)}</option>`).join('')}</select></div><div><label>Course</label><select id="rc"></select></div><div><label>Score (0-100)</label><input id="rsc" type="number" min="0" max="100" oninput="$('#gr').textContent=this.value===''?'-':gradeOf(+this.value)"></div><div><label>Grade (auto)</label><div id="gr" style="padding:11px 0;font-weight:700">-</div></div><div><label>Session</label><input id="rse" value="2025/2026" onchange="fillCourses()"></div><div><label>Semester</label><select id="rsm"><option>First</option><option>Second</option></select></div></div><button class="p" style="width:auto" onclick="addResult()">Submit for approval</button></div>`):resTable(R);
 else if(r=='HOD')b=tab=='pend'?`<p class="mut">Approving locks the result onto the blockchain automatically.</p>`+resTable(st('Pending'),x=>`<button class="s" onclick="approve(${x.id})">Approve</button> <button class="s" onclick="reject(${x.id})">Reject</button>`):(editId?editV():'')+`<p class="mut">Change a grade if a result was wrong. The Records Unit must approve the change before it counts.</p>`+resTable(st('Compiled'),x=>`<button class="s" onclick="editId=${x.id};render()">Change grade</button>`)+(st('Amended').length?`<h3 style="margin-top:14px">Waiting for Records Unit</h3>`+resTable(st('Amended')):'');
 else if(r=='RecordsUnit')b=tab=='chg'?`<p class="mut">The HOD changed these grades. Approve to lock the new grade onto the blockchain, or reject to restore the original.</p>`+resTable(st('Amended'),x=>`<button class="s" onclick="approveAmend(${x.id})">Approve change</button> <button class="s" onclick="rejectAmend(${x.id})">Reject</button>`):tab=='comp'?resTable(st('Compiled')):`<div class="card"><div class="row"><select id="cs">${DB.students.map(s=>`<option value="${s.id}">${s.matric} ${esc(s.name)}</option>`).join('')}</select><button onclick="issue()">Issue and lock on blockchain</button></div></div><div class="sc"><table><tr><th>ID</th><th>Reg. No.</th><th>Student</th><th>Issued</th><th>Block</th></tr>${DB.certs.map(c=>`<tr><td>CERT-${c.id}</td><td>${stu(c.studentId).matric}</td><td>${esc(stu(c.studentId).name)}</td><td>${c.date}</td><td>${c.blockId}</td></tr>`).join('')||'<tr><td colspan="5" class="mut">No certificates issued yet.</td></tr>'}</table></div>`;
 else b=tab=='chain'?(ns=1,chainV()):vlogV();
 return sec(f[1],b,ns)}
async function addResult(){const sc=$('#rsc').value;if(sc===''||sc<0||sc>100){msg='Enter a score between 0 and 100.';return render()}
 const sid=+$('#rs').value,cid=+$('#rc').value,sess=$('#rse').value;if(!cid||!isReg(sid,cid,sess)){msg='This student has not registered that course, so a result cannot be recorded.';return render()}
 DB.results.push({id:(DB.results.reduce((m,r)=>Math.max(m,r.id),0))+1,studentId:sid,courseId:cid,score:+sc,grade:gradeOf(+sc),session:sess,semester:$('#rsm').value,ts:now(),status:'Pending'});save();msg='Result submitted. It is now waiting for HOD approval.';render()}
async function approve(id){const r=DB.results.find(x=>x.id==id);await commit(r,me.id);save();msg='RES-'+id+' approved and locked in block '+r.blockId+'.';render()}
function reject(id){DB.results.find(x=>x.id==id).status='Returned';save();msg='RES-'+id+' returned to the lecturer.';render()}
const editV=()=>{const r=DB.results.find(x=>x.id==editId);return`<div class="card"><h3>Change grade for RES-${r.id}</h3><p class="mut">${esc(stu(r.studentId).name)}, ${crs(r.courseId).code}. Current: ${r.score} (${r.grade}).</p><div class="row"><div><label>New score</label><input id="es" type="number" min="0" max="100" value="${r.score}" oninput="$('#eg').value=gradeOf(+this.value)"></div><div><label>New grade</label><select id="eg">${'ABCDEF'.split('').map(g=>`<option ${g==r.grade?'selected':''}>${g}</option>`).join('')}</select></div></div><label>Reason (required)</label><input id="er" placeholder="e.g. Script re-marked after student appeal"><button class="p" style="width:auto" onclick="saveEdit()">Save change</button> <button onclick="editId=null;render()">Cancel</button></div>`};
function saveEdit(){const r=DB.results.find(x=>x.id==editId),sc=$('#es').value,g=$('#eg').value,why=$('#er').value.trim();
 if(sc===''||sc<0||sc>100||!why){msg='Enter a score from 0 to 100 and a reason.';return render()}
 if(+sc===r.score&&g===r.grade){msg='Nothing changed. Enter a different score or grade.';return render()}
 const o={score:r.score,grade:r.grade},n={score:+sc,grade:g};r.amend={o,n};r.score=n.score;r.grade=n.grade;r.status='Amended';audit('Changed',r,o,n,why);editId=null;save();msg='Change saved for RES-'+r.id+'. It now waits for Records Unit approval.';render()}
async function approveAmend(id){const r=DB.results.find(x=>x.id==id),a=r.amend;await commit(r,me.id);audit('Re-approved',r,a.o,a.n,'');delete r.amend;save();msg='Change to RES-'+id+' approved and locked in block '+r.blockId+'.';render()}
function rejectAmend(id){const r=DB.results.find(x=>x.id==id),a=r.amend;r.score=a.o.score;r.grade=a.o.grade;r.status='Compiled';audit('Rejected',r,a.n,a.o,'');delete r.amend;save();msg='Change to RES-'+id+' rejected. The original grade is restored.';render()}
async function issue(){const c={id:DB.certs.length+1,studentId:+$('#cs').value,date:new Date().toISOString().slice(0,10)};const b=await addBlock(certData(c));c.hash=b.hash;c.blockId=b.id;DB.certs.push(c);save();msg='CERT-'+c.id+' issued and locked in block '+b.id+'.';render()}
async function checkChain(){const bad=[];for(let i=0;i<DB.blocks.length;i++){const b=DB.blocks[i];if(await sha(b.data+b.prev+b.nonce)!==b.hash||(i&&b.prev!==DB.blocks[i-1].hash))bad.push(b.id)}chainMsg={bad,t:bad.length?'Chain broken at block(s) '+bad.join(', ')+'.':'All '+DB.blocks.length+' blocks are linked and intact.'};render()}
function tamper(){const r=DB.results.find(x=>x.status=='Compiled');if(!r)return;r.score=Math.min(100,r.score+10);save();msg='RES-'+r.id+' score changed in the database to '+r.score+'. The blockchain still holds the original.';render()}
function pay(){const sess='2025/2026';DB.payments.push({id:DB.payments.length+1,studentId:me.sid,session:sess,amount:50000,ref:'RCT-'+Math.random().toString(36).slice(2,8).toUpperCase(),at:now()});save();msg='Payment received. You can now register your courses.';render()}
function regC(cid){const sess='2025/2026';if(!isPaid(me.sid,sess)){msg='Pay your school fees first.';return render()}if(isReg(me.sid,cid,sess))return render();if(regCourses(me.sid,sess).length>=9){msg='You can register a maximum of 9 courses.';return render()}DB.regs.push({id:DB.regs.length+1,studentId:me.sid,courseId:cid,session:sess});save();render()}
function dropC(cid){const sess='2025/2026';DB.regs=DB.regs.filter(r=>!(r.studentId==me.sid&&r.courseId==cid&&r.session==sess));save();render()}
function printSlip(){try{window.print()}catch(e){msg="Printing is blocked here. Use your browser's Print option instead.";render()}}
const carry=sid=>{const o=[];DB.courses.forEach(c=>{const rows=DB.results.filter(r=>r.studentId==sid&&r.courseId==c.id&&r.status=='Compiled').sort((a,b)=>a.session.localeCompare(b.session));const last=rows[rows.length-1];if(last&&last.grade=='F')o.push({c,r:last})});return o};
function allSessions(sid){return[...new Set(DB.results.filter(r=>r.studentId==sid&&r.status=='Compiled').map(r=>r.session+'|'+r.semester))].sort()}
function gpaFor(sid,upTo){
 const all=DB.results.filter(r=>r.studentId==sid&&r.status=='Compiled').sort((a,b)=>(a.session+a.semester).localeCompare(b.session+b.semester));
 const cur=all.filter(r=>r.session==upTo.session&&r.semester==upTo.semester);
 const prev=all.filter(r=>(r.session+r.semester)<(upTo.session+upTo.semester));
 const sum=rows=>rows.reduce((a,r)=>{const u=crs(r.courseId).units,gp=GP[r.grade]*u;return{h:a.h+u,p:a.p+gp}},{h:0,p:0});
 const c=sum(cur),p=sum(prev),cum={h:c.h+p.h,p:c.p+p.p};
 return{cur,c,p,cum,gpa:c.h?(c.p/c.h).toFixed(2):'0.00',cgpa:cum.h?(cum.p/cum.h).toFixed(2):'0.00'}}
function slip(sid,session,semester){const s=stu(sid),d=gpaFor(sid,{session,semester});
 return`<div class="card"><div class="slip-head"><img src="${LOGO}" alt=""><div class="u">University of Cross River, Calabar</div><div class="addr">P.M.B 1123, Calabar, Cross River State, Nigeria</div><h3 style="margin-top:10px">Semester Report Form</h3></div>
<div class="bio"><div><b>Name:</b> ${esc(s.name)}</div><div><b>Reg. Number:</b> ${s.matric}</div><div><b>Faculty:</b> ${s.faculty}</div><div><b>Department:</b> ${s.dept}</div><div><b>Programme:</b> ${s.programme}</div><div><b>Year:</b> ${s.level} Level</div><div><b>Semester:</b> ${semester}</div><div><b>Issue Date:</b> ${new Date().toISOString().slice(0,10)}</div><div><b>Session:</b> ${session}</div><div><b>Entry Session:</b> ${s.entrySession}</div></div>
<div class="sc"><table><tr><th>S/N</th><th>Code</th><th>Course Title</th><th>Credit Hrs</th><th>Grade</th><th>Credit Pts</th></tr>${d.cur.map((r,i)=>`<tr><td>${i+1}</td><td>${crs(r.courseId).code}</td><td>${crs(r.courseId).title}</td><td>${crs(r.courseId).units}</td><td><span class="gd" style="background:${gdc[r.grade]}">${r.grade}</span></td><td>${GP[r.grade]*crs(r.courseId).units}</td></tr>`).join('')||'<tr><td colspan="6" class="mut">No results for this semester yet.</td></tr>'}</table></div>
<div class="gpa-row"><div class="mut">Total this semester<b>${d.c.h} hrs / ${d.c.p} pts</b></div><div class="mut">Total previous semester(s)<b>${d.p.h} hrs / ${d.p.p} pts</b></div><div class="mut">Cumulative<b>${d.cum.h} hrs / ${d.cum.p} pts</b></div><div class="mut">Semester GPA<b>${d.gpa}</b></div><div class="mut">Cumulative GPA<b>${d.cgpa}</b></div></div>
<p class="mut" style="margin-top:10px">Grading: A 70-100 (5pts), B 60-69 (4pts), C 50-59 (3pts), D 45-49 (2pts), E 40-44 (1pt), F below 40 (0pts)</p>
<p class="mut">Employers can verify any Result ID above using this student's registration number in the verification portal.</p>
<button class="p noprint" style="width:auto" onclick="printSlip()">Print this result</button></div>`}
function studentSec(){const s=stu(me.sid),sess='2025/2026',paid=isPaid(s.id,sess),rc=regCourses(s.id,sess),cy=carry(s.id),pm=DB.payments.find(p=>p.studentId==s.id&&p.session==sess);let t='',b='';
 if(tab=='fees'){t='School Fees';b=`<div class="card">${paid?`<p><span class="b Compiled">Paid</span> school fees for ${sess}.</p><p class="mut">Receipt ${pm.ref}, ${pm.at}</p>`:`<p><span class="b Pending">Unpaid</span> for ${sess}.</p><p class="mut">Course registration opens after payment.</p><button class="p" style="width:auto" onclick="pay()">Pay school fees</button>`}</div>`}
 else if(tab=='reg'){t='Course Registration';const u=rc.reduce((a,c)=>a+c.units,0);
  b=!paid?'<div class="card"><p class="mut">Pay your school fees first. Course registration opens after payment.</p></div>':`<div class="card">${slipHead2()}<h3>Registered courses (${rc.length} of 9), ${u} units</h3><div class="sc"><table><tr><th>Code</th><th>Title</th><th>Units</th><th>Type</th><th class="noprint"></th></tr>${rc.map(c=>`<tr><td>${c.code}</td><td>${c.title}</td><td>${c.units}</td><td>${cy.some(x=>x.c.id==c.id)?'Carryover':'Regular'}</td><td class="noprint">${hasRes(s.id,c.id,sess)?'<span class="mut">Graded</span>':`<button class="s" onclick="dropC(${c.id})">Drop</button>`}</td></tr>`).join('')||'<tr><td colspan="5" class="mut">No courses registered yet.</td></tr>'}</table></div><button class="p noprint" style="width:auto" onclick="printSlip()">Print course registration</button></div><div class="card noprint"><h3>Add courses</h3><div class="sc"><table><tr><th>Code</th><th>Title</th><th>Units</th><th></th></tr>${DB.courses.filter(c=>!isReg(s.id,c.id,sess)).map(c=>`<tr><td>${c.code}</td><td>${c.title}</td><td>${c.units}</td><td><button class="s" onclick="regC(${c.id})">Register</button></td></tr>`).join('')}</table></div></div>`}
 else if(tab=='res'){t='Results';const sessions=allSessions(s.id);if(!sf.session&&sessions.length){const parts=sessions[sessions.length-1].split('|');sf={session:parts[0],semester:parts[1]}}
  b=`<div class="card noprint"><h3>Select Session and Semester</h3><div class="row"><div><label>Session</label><select id="fs">${[...new Set(sessions.map(x=>x.split('|')[0]))].map(x=>`<option ${x==sf.session?'selected':''}>${x}</option>`).join('')||'<option>No results yet</option>'}</select></div><div><label>Semester</label><select id="fm"><option ${sf.semester=='First'?'selected':''}>First</option><option ${sf.semester=='Second'?'selected':''}>Second</option></select></div></div><button class="p" style="width:auto" onclick="fetchRes()">Fetch Results</button></div>${sessions.length?slip(s.id,sf.session,sf.semester):'<div class="card mut">No compiled results yet.</div>'}`}
 else{t='Carryover Courses';b=`<div class="card"><p class="mut">Courses you failed and have not yet passed.</p><div class="sc"><table><tr><th>Code</th><th>Title</th><th>Failed in</th><th>Score</th><th></th></tr>${cy.map(x=>`<tr><td>${x.c.code}</td><td>${x.c.title}</td><td>${x.r.session}</td><td>${x.r.score} (${x.r.grade})</td><td>${isReg(s.id,x.c.id,sess)?'<span class="mut">Registered</span>':paid?`<button class="s" onclick="regC(${x.c.id})">Register</button>`:'<span class="mut">Pay fees first</span>'}</td></tr>`).join('')||'<tr><td colspan="5" class="mut">You have no carryover courses.</td></tr>'}</table></div></div>`}
 if(tab=='print'){t='Print & Verify Receipt';b=`<div class="card"><p class="mut">Your receipt reference proves payment. Give the Result ID and your registration number to anyone who needs to verify a result.</p><div class="sc"><table><tr><th>Receipt</th><th>Session</th><th>Amount</th><th>Date</th></tr>${DB.payments.filter(p=>p.studentId==s.id).map(p=>`<tr><td>${p.ref}</td><td>${p.session}</td><td>N${p.amount.toLocaleString()}</td><td>${p.at}</td></tr>`).join('')||'<tr><td colspan="4" class="mut">No payments yet.</td></tr>'}</table></div><button class="p noprint" style="width:auto" onclick="printSlip()">Print this page</button></div>`}
 return sec(t,b,1)}
function fetchRes(){sf={session:$('#fs').value,semester:$('#fm').value};render()}
const slipHead2=()=>{const s=stu(me.sid);return`<div class="slip-head" style="text-align:left"><b>${esc(s.name)}</b><br><span class="mut">${s.matric}, ${s.dept}, ${s.level} level, 2025/2026 session</span></div>`};
function verifyV(){return`<div class="auth" style="max-width:480px"><div class="card"><h2>Verify a Result or Certificate</h2><p class="sub">Enter the student's registration number and the Result ID</p>

async function doVerify(){const reg=$('#vr').value.trim().toUpperCase(),id=$('#vid').value.trim().toUpperCase().replace(/\s+/g,'').replace(/^(RES|CERT)-?/,'$1-'),who=$('#vn').value.trim()||'Anonymous',st=DB.students.find(x=>x.matric.toUpperCase()==reg);let res='NotFound',rec,data,blk,sum='',re='';
 if(st&&id.startsWith('RES-')){rec=DB.results.find(r=>'RES-'+r.id==id&&r.blockId&&r.studentId==st.id);if(rec){data=recData(rec);sum=`${st.name} (${st.matric}), ${crs(rec.courseId).code} ${crs(rec.courseId).title}: ${rec.score} (${rec.grade}), ${rec.session} ${rec.semester} semester`}}
 else if(st&&id.startsWith('CERT-')){rec=DB.certs.find(c=>'CERT-'+c.id==id&&c.studentId==st.id);if(rec){data=certData(rec);sum=`Certificate for ${st.name} (${st.matric}), issued ${rec.date}`}}
 if(rec){blk=DB.blocks.find(b=>b.id==rec.blockId);re=await sha(data+blk.prev+blk.nonce);const own=await sha(blk.data+blk.prev+blk.nonce);res=re===blk.hash&&own===blk.hash?'Authentic':'Altered'}
 const am=id.startsWith('RES-')&&rec?DB.audit.filter(a=>a.resId==rec.id&&a.action=='Re-approved').length:0;
 DB.log.unshift({id:DB.log.length+1,rec:id||'(empty)',reg:reg||'-',who,at:now(),res});save();
 const say={Authentic:'Authentic. This record matches the blockchain.',Altered:'Altered. This record no longer matches what was locked on the blockchain.',NotFound:'Not found. No record matches that registration number and ID.'}[res];
 vres=`<div class="verdict ${res}">${say}</div>`+(blk?`<div class="card"><p>${esc(sum)}</p>${rec.status=='Amended'?'<p class="mut">A grade change on this record is waiting for Records Unit approval.</p>':''}${am?`<p class="mut">This record was changed and re-approved ${am} time(s).</p>`:''}<div class="hs"><div><b>Stored on blockchain (block ${blk.id})</b><br><span class="h">${blk.hash}</span></div><div><b>Recalculated from record now</b><br><span class="h" style="color:${res=='Authentic'?'var(--ok)':'var(--bd)'}">${re}</span></div></div></div>`:'');render()}
init();
</script></body></html>
